<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 المصطفى<title>هيكل عظمي مكتبة</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    cursor:none;               /* نخفي مؤشر الماوس */
  }
  canvas{display:block;position:fixed;inset:0}
  #hint{
    position:fixed;bottom:20px;left:0;right:0;text-align:center;
    color:#2c2c2c;font:13px/1.6 system-ui,"Segoe UI",sans-serif;
    letter-spacing:3px;pointer-events:none;user-select:none;
    transition:opacity 1.2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">حرّك الماوس… إنه قادم</div>

<script>
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const hint   = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;

  /* ---------------- إعداد الشاشة ---------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---------------- الماوس ---------------- */
  const mouse = { x: W * 0.5, y: H * 0.5, moved: false };

  function setMouse(x, y) {
    mouse.x = x;
    mouse.y = y;
    if (!mouse.moved) {
      mouse.moved = true;
      hint.style.opacity = '0';
    }
  }

  window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t) setMouse(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (t) setMouse(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /* ---------------- الهيكل العظمي ---------------- */
  const NUM      = 20;   // عدد الفقرات
  const SEG      = 13;   // المسافة بين كل فقرتين
  const BODY_END = 12;   // آخر فقرة في الجذع (ما بعدها ذيل)

  const spine = [];
  for (let i = 0; i < NUM; i++) {
    spine.push({ x: -170 - i * SEG, y: H * 0.5 }); // يبدأ خارج الشاشة ويزحف للداخل
  }

  let phase = 0;        // دورة المشي
  let headAngle = 0;    // اتجاه الرأس

  const BONE = '#e7e3d4';

  /* ---------------- التحديث ---------------- */
  function update(k) {
    const head = spine[0];

    let dx = mouse.x - head.x;
    let dy = mouse.y - head.y;
    let dist = Math.hypot(dx, dy);
    if (dist < 0.001) dist = 0.001;

    // سرعة المطاردة: تتباطأ عند الاقتراب من الهدف
    const speed = Math.min(dist * 0.14, 15) * k;

    head.x += (dx / dist) * speed;
    head.y += (dy / dist) * speed;

    // اتجاه الرأس (مع تنعيم الدوران)
    const target = Math.atan2(dy, dx);
    let da = target - headAngle;
    while (da >  Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    headAngle += da * Math.min(1, 0.18 * k);

    // سلسلة الفقرات: كل فقرة تتبع التي قبلها
    for (let i = 1; i < NUM; i++) {
      const a = spine[i - 1], b = spine[i];
      const ddx = b.x - a.x, ddy = b.y - a.y;
      const d = Math.hypot(ddx, ddy) || 1;
      const diff = (d - SEG) / d;
      b.x -= ddx * diff;
      b.y -= ddy * diff;
    }

    // دورة الأرجل
    phase += (speed * 0.02 + 0.015) * k;

    updateDust(k);
  }

  /* ---------------- أدوات مساعدة ---------------- */
  function dot(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function bone(x1, y1, x2, y2, w) {
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    dot(x1, y1, w * 0.75);
    dot(x2, y2, w * 0.75);
  }

  // زاوية العمود الفقري عند الفقرة i
  function segAngle(i) {
    const a = spine[Math.max(0, i - 1)];
    const b = spine[Math.min(NUM - 1, i + 1)];
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  // عكس الحركة بذراعين (IK)
  function ik(hip, foot, l1, l2, bend) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, l1 + l2 - 0.01);
    d = Math.max(d, Math.abs(l1 - l2) + 0.01);
    const a = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const ang = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ka = a + ang * bend;
    return { x: hip.x + Math.cos(ka) * l1, y: hip.y + Math.sin(ka) * l1 };
  }

  /* ---------------- الغبار ---------------- */
  const dust = [];

  function updateDust(k) {
    const tail = spine[NUM - 1];
    if (Math.random() < 0.35) {
      dust.push({
        x: tail.x + (Math.random() - 0.5) * 26,
        y: tail.y + (Math.random() - 0.5) * 26,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -0.15 - Math.random() * 0.35,
        life: 1,
        r: 0.5 + Math.random() * 1.5
      });
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * k;
      p.y += p.vy * k;
      p.life -= 0.008 * k;
      if (p.life <= 0) dust.splice(i, 1);
    }
    if (dust.length > 320) dust.splice(0, dust.length - 320);
  }

  function drawDust() {
    ctx.fillStyle = 'rgba(150,180,220,1)';
    for (const p of dust) {
      ctx.globalAlpha = p.life * 0.45;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- رسم أجزاء الهيكل ---------------- */

  // الذيل
  function drawTail() {
    for (let i = BODY_END + 1; i < NUM - 1; i++) {
      const t = (i - BODY_END) / (NUM - 1 - BODY_END);
      const w = Math.max(1.1, 3.6 - t * 2.4);
      bone(spine[i].x, spine[i].y, spine[i + 1].x, spine[i + 1].y, w);
    }
  }

  // الأضلاع
  function drawRibs() {
    ctx.lineWidth = 2.2;
    for (let i = 3; i <= 10; i++) {
      const p = spine[i];
      const a = segAngle(i);
      const fx = Math.cos(a), fy = Math.sin(a);
      const nx = -fy, ny = fx;

      const t = (i - 3) / 7;
      const len = 8 + 14 * Math.sin(t * Math.PI);

      for (const s of [1, -1]) {
        const ox = nx * s, oy = ny * s;
        const cx = p.x + fx * len * 0.10 + ox * len * 1.00;
        const cy = p.y + fy * len * 0.10 + oy * len * 1.00;
        const ex = p.x + fx * len * 0.55 + ox * len * 0.30;
        const ey = p.y + fy * len * 0.55 + oy * len * 0.30;

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo(cx, cy, ex, ey);
        ctx.stroke();
      }
    }
  }

  // العمود الفقري
  function drawSpine() {
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(spine[0].x, spine[0].y);
    for (let i = 1; i <= BODY_END; i++) ctx.lineTo(spine[i].x, spine[i].y);
    ctx.stroke();

    for (let i = 1; i <= BODY_END; i++) dot(spine[i].x, spine[i].y, 2.2);
  }

  // الأرجل الأربعة (نمشيها بترتيب متقاطع)
  const LEGS = [
    { i: 4,  side:  1, off: 0 },
    { i: 4,  side: -1, off: Math.PI },
    { i: 10, side:  1, off: Math.PI },
    { i: 10, side: -1, off: 0 }
  ];

  function drawLegs() {
    for (const L of LEGS) {
      const p = spine[L.i];
      const a = segAngle(L.i);
      const fx = Math.cos(a), fy = Math.sin(a);
      const nx = -fy * L.side, ny = fx * L.side;

      const hip = { x: p.x + nx * 7, y: p.y + ny * 7 };

      const s = Math.sin(phase + L.off);
      const reach = 24 + Math.max(0, s) * 6;

      const foot = {
        x: hip.x + nx * reach + fx * (s * 12),
        y: hip.y + ny * reach + fy * (s * 12)
      };

      const knee = ik(hip, foot, 17, 17, L.side);

      bone(hip.x, hip.y, knee.x, knee.y, 2.8);
      bone(knee.x, knee.y, foot.x, foot.y, 2.3);
      dot(foot.x, foot.y, 2.6);
    }
  }

  // الجمجمة
  function drawSkull(x, y, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);

    ctx.fillStyle = BONE;
    ctx.shadowColor = 'rgba(150,190,255,0.5)';
    ctx.shadowBlur = 10;

    // القحف
    ctx.beginPath();
    ctx.ellipse(-2, 0, 14, 12, 0, 0, TAU);
    ctx.fill();

    // الفك / الأنف
    ctx.beginPath();
    ctx.ellipse(14, 0, 12, 8.5, 0, 0, TAU);
    ctx.fill();

    // الأنياب
    for (let i = -2; i <= 2; i++) {
      const th = i * 0.45;
      const bx = 14 + Math.cos(th) * 12;
      const by = 0 + Math.sin(th) * 8.5;
      const nx = Math.cos(th), ny = Math.sin(th);
      const px = -ny, py = nx;
      ctx.beginPath();
      ctx.moveTo(bx + px * 1.6, by + py * 1.6);
      ctx.lineTo(bx + nx * 4.0, by + ny * 4.0);
      ctx.lineTo(bx - px * 1.6, by - py * 1.6);
      ctx.closePath();
      ctx.fill();
    }

    // محجرا العين + فتحتا الأنف (بالأسود)
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-1, -5.2, 4.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-1,  5.2, 4.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(19, -2.2, 1.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(19,  2.2, 1.3, 0, TAU); ctx.fill();

    // العيون الحمراء المتوهجة
    ctx.fillStyle = '#ff2a2a';
    ctx.shadowColor = 'rgba(255,20,20,0.95)';
    ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(0.2, -5.0, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0.2,  5.0, 2.1, 0, TAU); ctx.fill();

    ctx.restore();
  }

  // هدف الماوس (بدل المؤشر المخفي)
  function drawTarget(now) {
    const r = 11 + Math.sin(now * 0.006) * 3;
    ctx.save();
    ctx.shadowColor = 'rgba(255,0,0,0.85)';
    ctx.shadowBlur = 14;
    ctx.strokeStyle = 'rgba(255,60,60,0.65)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, r, 0, TAU);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,80,80,0.95)';
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 2.2, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ---------------- الرسم ---------------- */
  function render(now) {
    // خلفية سوداء
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    drawTarget(now);

    // غبار
    ctx.save();
    ctx.shadowBlur = 0;
    drawDust();
    ctx.restore();

    // الهيكل العظمي
    ctx.save();
    ctx.strokeStyle = BONE;
    ctx.fillStyle   = BONE;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.shadowColor = 'rgba(150,190,255,0.55)';
    ctx.shadowBlur  = 9;

    drawTail();
    drawRibs();
    drawSpine();
    drawLegs();
    drawSkull(spine[0].x, spine[0].y, headAngle);

    ctx.restore();
  }

  /* ---------------- الحلقة الرئيسية ---------------- */
  let last = performance.now();

  function loop(now) {
    const dt = Math.min(now - last, 50);
    last = now;
    const k = dt / 16.667;   // معامل التوحيد مع 60fps

    update(k);
    render(now);

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
