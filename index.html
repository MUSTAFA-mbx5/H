<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة المصطفى | الوحش الهيكلي</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    cursor:none;
    font-family:"Amiri","Times New Roman",serif;
  }
  canvas{display:block;position:fixed;inset:0}

  #overlay{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1a0000 0%,#050000 55%,#000 100%);
    z-index:50;text-align:center;padding:24px;
    transition:opacity .9s ease,visibility .9s ease;
  }
  #overlay.hide{opacity:0;visibility:hidden}
  #overlay h1{
    color:#8b0000;
    font-size:clamp(28px,6vw,62px);
    letter-spacing:6px;
    text-shadow:0 0 18px #ff0000,0 0 40px #550000;
    margin-bottom:18px;
    animation:flick 3.2s infinite;
  }
  @keyframes flick{
    0%,18%,22%,25%,53%,57%,100%{opacity:1;text-shadow:0 0 18px #ff0000,0 0 40px #550000}
    20%,24%,55%{opacity:.4;text-shadow:none}
  }
  #overlay p{
    color:#5c5c5c;font-size:clamp(13px,2.2vw,17px);
    letter-spacing:3px;max-width:640px;line-height:2;margin-bottom:12px;
  }
  #overlay .warn{color:#7a1a1a;font-size:13px;letter-spacing:2px;margin-bottom:34px}
  #enter{
    cursor:pointer;background:transparent;
    color:#c9c4b4;border:1px solid #6b1414;
    padding:14px 46px;font-size:18px;letter-spacing:6px;
    font-family:inherit;border-radius:2px;
    text-shadow:0 0 8px #a00;
    transition:.35s ease;
    animation:pulse 2.6s infinite;
  }
  #enter:hover{
    background:#1a0000;color:#ff3b3b;border-color:#c00000;
    box-shadow:0 0 30px rgba(255,0,0,.55);
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 rgba(255,0,0,0)}
    50%{box-shadow:0 0 22px rgba(180,0,0,.5)}
  }
  #overlay .copy{
    position:absolute;bottom:22px;left:0;right:0;
    color:#4a3b3b;font-size:12px;letter-spacing:3px;
  }

  #watermark{
    position:fixed;bottom:12px;left:0;right:0;
    text-align:center;color:#2a1010;font-size:12px;
    letter-spacing:5px;pointer-events:none;user-select:none;
    z-index:40;text-shadow:0 0 8px #000;
    opacity:.8;
  }
  #watermark b{color:#4a1414;font-weight:normal}

  #hint{
    position:fixed;top:22px;left:0;right:0;text-align:center;
    color:#3a1414;font-size:12px;letter-spacing:6px;
    pointer-events:none;user-select:none;z-index:40;
    transition:opacity 2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">اهــرب… إن استطعت</div>

<div id="watermark">© جميع الحقوق محفوظة — <b>مكتبة المصطفى</b></div>

<div id="overlay">
  <h1>الــوحــش الــعــظــمــي</h1>
  <p>ليس هيكلاً عادياً… إنه شيءٌ أقدم من الموت نفسه، جائعٌ، لا يتوقف.</p>
  <div class="warn">⚠ يُنصح برفع مستوى الصوت — لا تنظر إليه طويلاً ⚠</div>
  <button id="enter">واجهــه إن جــرؤت</button>
  <div class="copy">© مكتبة المصطفى — جميع الحقوق محفوظة</div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     محرك الصوت المرعب
     ============================================================ */
  let audio = null;

  function buildHorrorAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    const master = ctx.createGain();
    master.gain.value = 0.0001;
    master.connect(ctx.destination);
    master.gain.exponentialRampToValueAtTime(0.45, ctx.currentTime + 4);

    // درون عميق جداً
    const d1 = ctx.createOscillator();
    d1.type = 'sine';
    d1.frequency.value = 28;                 // أعمق
    const d1g = ctx.createGain();
    d1g.gain.value = 0.65;
    d1.connect(d1g).connect(master);
    d1.start();

    const d2 = ctx.createOscillator();
    d2.type = 'sine';
    d2.frequency.value = 28.9;
    const d2g = ctx.createGain();
    d2g.gain.value = 0.45;
    d2.connect(d2g).connect(master);
    d2.start();

    // طبقة وسطى مشوهة
    const mid = ctx.createOscillator();
    mid.type = 'sawtooth';
    mid.frequency.value = 62;
    const midF = ctx.createBiquadFilter();
    midF.type = 'lowpass';
    midF.frequency.value = 140;
    midF.Q.value = 12;
    const midG = ctx.createGain();
    midG.gain.value = 0.055;
    mid.connect(midF).connect(midG).connect(master);
    mid.start();

    const lfo1 = ctx.createOscillator();
    lfo1.frequency.value = 0.06;
    const lfo1g = ctx.createGain();
    lfo1g.gain.value = 140;
    lfo1.connect(lfo1g).connect(midF.frequency);
    lfo1.start();

    // ضجيج رياح
    const bufLen = ctx.sampleRate * 3;
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const bd = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) bd[i] = Math.random() * 2 - 1;

    const wind = ctx.createBufferSource();
    wind.buffer = buf;
    wind.loop = true;
    const windF = ctx.createBiquadFilter();
    windF.type = 'bandpass';
    windF.frequency.value = 300;
    windF.Q.value = 0.6;
    const windG = ctx.createGain();
    windG.gain.value = 0.07;
    wind.connect(windF).connect(windG).connect(master);
    wind.start();

    const lfo2 = ctx.createOscillator();
    lfo2.frequency.value = 0.04;
    const lfo2g = ctx.createGain();
    lfo2g.gain.value = 0.06;
    lfo2.connect(lfo2g).connect(windG.gain);
    lfo2.start();

    // زئير الوحش العميق
    function growl() {
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(48, t);
      o.frequency.linearRampToValueAtTime(32, t + 1.2);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 180;
      f.Q.value = 8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.13, t + 0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o.connect(f).connect(g).connect(master);
      o.start(t);
      o.stop(t + 1.5);
    }

    // نبضة قلب
    function heartbeat() {
      const t = ctx.currentTime;
      [0, 0.17].forEach((off, i) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        const v = i === 0 ? 58 : 44;
        o.frequency.setValueAtTime(v, t + off);
        o.frequency.exponentialRampToValueAtTime(24, t + off + 0.2);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.linearRampToValueAtTime(i === 0 ? 0.85 : 0.6, t + off + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.34);
        o.connect(g).connect(master);
        o.start(t + off);
        o.stop(t + off + 0.38);
      });
    }

    // صرير مفاجئ
    function stab() {
      const t = ctx.currentTime;
      const scale = [185, 196, 207.65, 220, 233.08, 246.94, 261.63];
      const base = scale[Math.floor(Math.random() * scale.length)];
      [1, 1.06].forEach((m) => {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = base * m;
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(2600, t);
        f.frequency.exponentialRampToValueAtTime(280, t + 1.6);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.09, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        o.connect(f).connect(g).connect(master);
        o.start(t);
        o.stop(t + 1.9);
      });
    }

    // عواء بعيد
    function wail() {
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = 'sine';
      const start = 520 + Math.random() * 340;
      o.frequency.setValueAtTime(start, t);
      o.frequency.exponentialRampToValueAtTime(start * 0.35, t + 2.8);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.065, t + 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
      const rev = ctx.createBiquadFilter();
      rev.type = 'bandpass';
      rev.frequency.value = 800;
      rev.Q.value = 1.5;
      o.connect(rev).connect(g).connect(master);
      o.start(t);
      o.stop(t + 3.2);
    }

    return { ctx, master, heartbeat, stab, wail, growl };
  }

  let timers = [];
  function scheduleHorror() {
    const loop = () => {
      if (!audio) return;
      audio.heartbeat();
      timers.push(setTimeout(loop, 900 + Math.random() * 300));
    };
    loop();

    const loopStab = () => {
      if (!audio) return;
      audio.stab();
      timers.push(setTimeout(loopStab, 3000 + Math.random() * 6000));
    };
    setTimeout(loopStab, 2000);

    const loopWail = () => {
      if (!audio) return;
      audio.wail();
      timers.push(setTimeout(loopWail, 7000 + Math.random() * 10000));
    };
    setTimeout(loopWail, 4500);

    // زئير الوحش
    const loopGrowl = () => {
      if (!audio) return;
      audio.growl();
      timers.push(setTimeout(loopGrowl, 2200 + Math.random() * 3500));
    };
    setTimeout(loopGrowl, 1500);
  }

  /* ============================================================
     إعداد الكانفس
     ============================================================ */
  const canvas = document.getElementById('c');
  const ctx2d = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx2d.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ============================================================
     الماوس
     ============================================================ */
  const mouse = { x: W * 0.5, y: H * 0.5 };
  const hintEl = document.getElementById('hint');

  function setMouse(x, y) {
    mouse.x = x; mouse.y = y;
    if (hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
  }
  window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchstart', e => {
    const t = e.touches[0]; if (t) setMouse(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (t) setMouse(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /* ============================================================
     الوحش الهيكلي — أكبر بكثير
     ============================================================ */
  const TAU = Math.PI * 2;
  const NUM = 26;               // فقرات أكثر
  const SEG = 22;               // مسافة أكبر = جسم أطول
  const BODY_END = 16;
  const BONE = '#e5e0cf';
  const BONE_DARK = '#5a5340';

  // حجم عام للوحش — سر كبير!
  const SCALE = 1.75;

  const spine = [];
  for (let i = 0; i < NUM; i++) {
    spine.push({ x: -400 - i * SEG, y: H * 0.5 });
  }

  let phase = 0;
  let headAngle = 0;
  let shake = 0;
  let redFlash = 0;
  let proximity = 0;          // 0..1 مدى قرب الوحش

  function dot(x, y, r) {
    ctx2d.beginPath();
    ctx2d.arc(x, y, r, 0, TAU);
    ctx2d.fill();
  }
  function bone(x1, y1, x2, y2, w) {
    ctx2d.lineWidth = w;
    ctx2d.beginPath();
    ctx2d.moveTo(x1, y1);
    ctx2d.lineTo(x2, y2);
    ctx2d.stroke();
    dot(x1, y1, w * 0.75);
    dot(x2, y2, w * 0.75);
  }
  function segAngle(i) {
    const a = spine[Math.max(0, i - 1)];
    const b = spine[Math.min(NUM - 1, i + 1)];
    return Math.atan2(b.y - a.y, b.x - a.x);
  }
  function ik(hip, foot, l1, l2, bend) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, l1 + l2 - 0.01);
    d = Math.max(d, Math.abs(l1 - l2) + 0.01);
    const a = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const ang = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ka = a + ang * bend;
    return { x: hip.x + Math.cos(ka) * l1, y: hip.y + Math.sin(ka) * l1 };
  }

  /* ============================================================
     جزيئات
     ============================================================ */
  const dust = [];
  const fog  = [];
  const blood = [];
  const embers = [];      // شرارات حمراء تنبعث من الوحش

  for (let i = 0; i < 30; i++) {
    fog.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 110 + Math.random() * 240,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.18,
      a: 0.022 + Math.random() * 0.04
    });
  }

  function spawnDust() {
    const tail = spine[NUM - 1];
    if (Math.random() < 0.5) {
      dust.push({
        x: tail.x + (Math.random() - 0.5) * 45,
        y: tail.y + (Math.random() - 0.5) * 45,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -0.15 - Math.random() * 0.5,
        life: 1,
        r: 0.6 + Math.random() * 2.2
      });
    }
    if (dust.length > 400) dust.splice(0, dust.length - 400);
  }

  function spawnEmbers() {
    // شرارات من الجمجمة
    const head = spine[0];
    if (Math.random() < 0.6) {
      const a = headAngle + (Math.random() - 0.5) * 1.4;
      const r = 28 * SCALE;
      embers.push({
        x: head.x + Math.cos(a) * r,
        y: head.y + Math.sin(a) * r,
        vx: (Math.random() - 0.5) * 1.2,
        vy: -0.4 - Math.random() * 0.9,
        life: 1,
        r: 0.8 + Math.random() * 2.2
      });
    }
    if (embers.length > 260) embers.splice(0, embers.length - 260);
  }

  function spawnBlood(x, y) {
    blood.push({
      x: x, y: y,
      vy: 0.6 + Math.random() * 1.8,
      r: 1 + Math.random() * 3.5,
      life: 1
    });
    if (blood.length > 150) blood.splice(0, blood.length - 150);
  }

  function updateParticles(k) {
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * k; p.y += p.vy * k;
      p.life -= 0.008 * k;
      if (p.life <= 0) dust.splice(i, 1);
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const p = embers[i];
      p.x += p.vx * k; p.y += p.vy * k;
      p.vy += 0.02 * k;
      p.life -= 0.012 * k;
      if (p.life <= 0) embers.splice(i, 1);
    }
    for (const f of fog) {
      f.x += f.vx * k; f.y += f.vy * k;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r;
      if (f.y > H + f.r) f.y = -f.r;
    }
    for (let i = blood.length - 1; i >= 0; i--) {
      const b = blood[i];
      b.y += b.vy * k;
      if (b.y > H + 30) blood.splice(i, 1);
    }
  }

  /* ============================================================
     تحديث الوحش
     ============================================================ */
  function update(k) {
    const head = spine[0];

    let dx = mouse.x - head.x;
    let dy = mouse.y - head.y;
    let dist = Math.hypot(dx, dy) || 0.001;

    const speed = Math.min(dist * 0.16, 18) * k;
    head.x += (dx / dist) * speed;
    head.y += (dy / dist) * speed;

    const target = Math.atan2(dy, dx);
    let da = target - headAngle;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    headAngle += da * Math.min(1, 0.15 * k);

    for (let i = 1; i < NUM; i++) {
      const a = spine[i - 1], b = spine[i];
      const ddx = b.x - a.x, ddy = b.y - a.y;
      const d = Math.hypot(ddx, ddy) || 1;
      const diff = (d - SEG) / d;
      b.x -= ddx * diff;
      b.y -= ddy * diff;
    }

    phase += (speed * 0.018 + 0.014) * k;

    // مدى القرب
    proximity = Math.max(0, Math.min(1, 1 - dist / 260));

    // اهتزاز + فلاش + دم عند القرب
    if (dist < 200) {
      shake = Math.max(shake, Math.min(14, (200 - dist) * 0.12));
      if (Math.random() < 0.35) spawnBlood(mouse.x, -10);
      if (Math.random() < 0.03) redFlash = Math.max(redFlash, 0.55);
    }
    shake *= Math.pow(0.90, k);
    redFlash *= Math.pow(0.94, k);

    updateParticles(k);
    spawnDust();
    spawnEmbers();
  }

  /* ============================================================
     الرسم
     ============================================================ */

  function drawFog() {
    ctx2d.save();
    ctx2d.globalCompositeOperation = 'lighter';
    for (const f of fog) {
      const g = ctx2d.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, `rgba(70,15,15,${f.a})`);
      g.addColorStop(0.5, `rgba(30,8,8,${f.a * 0.5})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx2d.fillStyle = g;
      ctx2d.beginPath();
      ctx2d.arc(f.x, f.y, f.r, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.restore();
  }

  function drawDust() {
    ctx2d.fillStyle = 'rgba(150,180,220,1)';
    for (const p of dust) {
      ctx2d.globalAlpha = p.life * 0.4;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.r, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.globalAlpha = 1;
  }

  function drawEmbers() {
    ctx2d.save();
    ctx2d.shadowColor = 'rgba(255,60,0,0.9)';
    ctx2d.shadowBlur = 12;
    for (const p of embers) {
      ctx2d.globalAlpha = p.life * 0.9;
      const g = ctx2d.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, 'rgba(255,200,100,1)');
      g.addColorStop(0.4, 'rgba(255,60,0,0.8)');
      g.addColorStop(1, 'rgba(120,0,0,0)');
      ctx2d.fillStyle = g;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.r * 3, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.restore();
  }

  function drawBlood() {
    ctx2d.save();
    ctx2d.fillStyle = 'rgba(120,0,0,1)';
    ctx2d.shadowColor = 'rgba(255,0,0,0.7)';
    ctx2d.shadowBlur = 8;
    for (const b of blood) {
      ctx2d.globalAlpha = 0.85;
      ctx2d.beginPath();
      ctx2d.arc(b.x, b.y, b.r, 0, TAU);
      ctx2d.fill();
      ctx2d.beginPath();
      ctx2d.ellipse(b.x, b.y - b.r * 1.6, b.r * 0.55, b.r * 1.6, 0, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.restore();
  }

  // ذيل بأشواك
  function drawTail() {
    for (let i = BODY_END + 1; i < NUM - 1; i++) {
      const t = (i - BODY_END) / (NUM - 1 - BODY_END);
      const w = Math.max(1.4, 5.5 - t * 3.6);
      bone(spine[i].x, spine[i].y, spine[i + 1].x, spine[i + 1].y, w);

      // أشواك على الذيل
      if (i % 2 === 0 && i < NUM - 2) {
        const p = spine[i];
        const a = segAngle(i);
        const nx = -Math.sin(a), ny = Math.cos(a);
        const sl = 9 * SCALE * (1 - t * 0.6);
        ctx2d.lineWidth = 1.6;
        for (const s of [1, -1]) {
          ctx2d.beginPath();
          ctx2d.moveTo(p.x, p.y);
          ctx2d.lineTo(p.x + nx * s * sl, p.y + ny * s * sl);
          ctx2d.stroke();
        }
      }
    }
    // رأس مدبب للذيل
    const last = spine[NUM - 1];
    const prev = spine[NUM - 2];
    const a = Math.atan2(last.y - prev.y, last.x - prev.x);
    const tl = 16 * SCALE;
    ctx2d.lineWidth = 1.4;
    ctx2d.beginPath();
    ctx2d.moveTo(last.x, last.y);
    ctx2d.lineTo(last.x + Math.cos(a) * tl, last.y + Math.sin(a) * tl);
    ctx2d.stroke();
  }

  // أضلاع أكبر وأكثر
  function drawRibs() {
    ctx2d.lineWidth = 3.2;
    for (let i = 3; i <= 13; i++) {
      const p = spine[i];
      const a = segAngle(i);
      const fx = Math.cos(a), fy = Math.sin(a);
      const nx = -fy, ny = fx;
      const t = (i - 3) / 10;
      const len = 12 + 22 * Math.sin(t * Math.PI);
      for (const s of [1, -1]) {
        const ox = nx * s, oy = ny * s;
        const cx = p.x + fx * len * 0.12 + ox * len * 1.15;
        const cy = p.y + fy * len * 0.12 + oy * len * 1.15;
        const ex = p.x + fx * len * 0.6 + ox * len * 0.3;
        const ey = p.y + fy * len * 0.6 + oy * len * 0.3;
        ctx2d.beginPath();
        ctx2d.moveTo(p.x, p.y);
        ctx2d.quadraticCurveTo(cx, cy, ex, ey);
        ctx2d.stroke();
      }
    }
  }

  function drawSpine() {
    ctx2d.lineWidth = 5.5;
    ctx2d.beginPath();
    ctx2d.moveTo(spine[0].x, spine[0].y);
    for (let i = 1; i <= BODY_END; i++) ctx2d.lineTo(spine[i].x, spine[i].y);
    ctx2d.stroke();
    for (let i = 1; i <= BODY_END; i++) {
      dot(spine[i].x, spine[i].y, 3.6);
      // أشواك علوية على العمود الفقري
      if (i % 2 === 0 && i >= 3) {
        const p = spine[i];
        const a = segAngle(i);
        const nx = -Math.sin(a), ny = Math.cos(a);
        const sl = 10 * SCALE;
        ctx2d.lineWidth = 1.8;
        ctx2d.beginPath();
        ctx2d.moveTo(p.x, p.y);
        ctx2d.lineTo(p.x + nx * sl, p.y + ny * sl);
        ctx2d.stroke();
      }
    }
  }

  // 6 أرجل ضخمة بمخالب
  const LEGS = [
    { i: 4,  side:  1, off: 0 },
    { i: 4,  side: -1, off: Math.PI },
    { i: 9,  side:  1, off: Math.PI * 0.5 },
    { i: 9,  side: -1, off: Math.PI * 1.5 },
    { i: 14, side:  1, off: Math.PI },
    { i: 14, side: -1, off: 0 }
  ];

  function drawLegs() {
    for (const L of LEGS) {
      const p = spine[L.i];
      const a = segAngle(L.i);
      const fx = Math.cos(a), fy = Math.sin(a);
      const nx = -fy * L.side, ny = fx * L.side;
      const hip = { x: p.x + nx * 10, y: p.y + ny * 10 };
      const s = Math.sin(phase + L.off);
      const reach = 42 * SCALE + Math.max(0, s) * 12 * SCALE;
      const foot = {
        x: hip.x + nx * reach + fx * (s * 20 * SCALE),
        y: hip.y + ny * reach + fy * (s * 20 * SCALE)
      };
      const knee = ik(hip, foot, 28 * SCALE, 28 * SCALE, L.side);
      bone(hip.x, hip.y, knee.x, knee.y, 4);
      bone(knee.x, knee.y, foot.x, foot.y, 3.2);

      // مخالب
      const fa = Math.atan2(foot.y - knee.y, foot.x - knee.x);
      ctx2d.lineWidth = 1.8;
      for (let c = -1; c <= 1; c++) {
        const ca = fa + c * 0.5;
        ctx2d.beginPath();
        ctx2d.moveTo(foot.x, foot.y);
        ctx2d.lineTo(foot.x + Math.cos(ca) * 14, foot.y + Math.sin(ca) * 14);
        ctx2d.stroke();
      }
      dot(foot.x, foot.y, 3.4);
    }
  }

  /* الجمجمة المخيفة العملاقة */
  function drawSkull(x, y, a) {
    const s = SCALE * 1.15;    // حجم الجمجمة

    ctx2d.save();
    ctx2d.translate(x, y);
    ctx2d.rotate(a);

    // هالة حمراء عملاقة
    const halo = ctx2d.createRadialGradient(0, 0, 4, 0, 0, 70 * s);
    halo.addColorStop(0, `rgba(200,0,0,${0.35 + proximity * 0.4})`);
    halo.addColorStop(0.4, `rgba(140,0,0,${0.15 + proximity * 0.15})`);
    halo.addColorStop(1, 'rgba(80,0,0,0)');
    ctx2d.fillStyle = halo;
    ctx2d.beginPath();
    ctx2d.arc(0, 0, 70 * s, 0, TAU);
    ctx2d.fill();

    ctx2d.scale(s, s);
    ctx2d.fillStyle = BONE;
    ctx2d.shadowColor = `rgba(255,20,20,${0.7 + proximity * 0.3})`;
    ctx2d.shadowBlur = 20;

    // القحف
    ctx2d.beginPath();
    ctx2d.ellipse(-3, 0, 18, 16, 0, 0, TAU);
    ctx2d.fill();

    // نتوءات على القحف (أشواك)
    for (let i = 0; i < 7; i++) {
      const ang = Math.PI + (i / 6) * Math.PI;
      const bx = -3 + Math.cos(ang) * 16;
      const by = Math.sin(ang) * 14;
      const nx = Math.cos(ang), ny = Math.sin(ang);
      ctx2d.beginPath();
      ctx2d.moveTo(bx - ny * 2.2, by + nx * 2.2);
      ctx2d.lineTo(bx + nx * 7, by + ny * 7);
      ctx2d.lineTo(bx + ny * 2.2, by - nx * 2.2);
      ctx2d.closePath();
      ctx2d.fill();
    }

    // الوجه / الفك العلوي
    ctx2d.beginPath();
    ctx2d.ellipse(15, 0, 15, 11, 0, 0, TAU);
    ctx2d.fill();

    // شقوق عميقة
    ctx2d.shadowBlur = 0;
    ctx2d.strokeStyle = BONE_DARK;
    ctx2d.lineWidth = 1.2;
    ctx2d.beginPath();
    ctx2d.moveTo(-15, -8); ctx2d.lineTo(-8, -3); ctx2d.lineTo(-12, 4);
    ctx2d.moveTo(-5, -14); ctx2d.lineTo(-1, -7);
    ctx2d.moveTo(3, 11); ctx2d.lineTo(7, 5);
    ctx2d.moveTo(-18, 3); ctx2d.lineTo(-13, 7);
    ctx2d.stroke();

    // فتحة الأنف الكبيرة المخيفة
    ctx2d.fillStyle = '#000';
    ctx2d.beginPath();
    ctx2d.ellipse(24, 0, 3.5, 4.5, 0, 0, TAU);
    ctx2d.fill();

    // أسنان حادة كالخناجر
    ctx2d.fillStyle = BONE;
    for (let i = -3; i <= 3; i++) {
      const th = i * 0.34;
      const bx = 15 + Math.cos(th) * 15;
      const by = Math.sin(th) * 11;
      const nx = Math.cos(th), ny = Math.sin(th);
      const px = -ny, py = nx;
      const L = i === 0 ? 11 : 9 - Math.abs(i) * 0.7;
      ctx2d.beginPath();
      ctx2d.moveTo(bx + px * 2.2, by + py * 2.2);
      ctx2d.lineTo(bx + nx * L, by + ny * L);
      ctx2d.lineTo(bx - px * 2.2, by - py * 2.2);
      ctx2d.closePath();
      ctx2d.fill();
    }

    // فك سفلي بأسنان
    ctx2d.beginPath();
    ctx2d.ellipse(20, 0, 12, 4, 0, 0, TAU);
    ctx2d.fill();
    ctx2d.fillStyle = BONE;
    for (let i = -2; i <= 2; i++) {
      const bx = 20 + i * 4.5;
      ctx2d.beginPath();
      ctx2d.moveTo(bx - 1.5, -1);
      ctx2d.lineTo(bx, -6);
      ctx2d.lineTo(bx + 1.5, -1);
      ctx2d.closePath();
      ctx2d.fill();
    }

    // محجرا العين — أكبر وأعمق
    ctx2d.fillStyle = '#000';
    ctx2d.beginPath(); ctx2d.ellipse(-1, -7, 6.5, 6, 0, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.ellipse(-1,  7, 6.5, 6, 0, 0, TAU); ctx2d.fill();

    // عيون حمراء متوهجة — نبض قوي + توسع عند القرب
    const pulse = 0.7 + 0.3 * Math.sin(performance.now() * 0.01);
    const eyeSize = 3 + proximity * 1.5;
    ctx2d.fillStyle = `rgba(255,15,15,${pulse})`;
    ctx2d.shadowColor = 'rgba(255,0,0,1)';
    ctx2d.shadowBlur = 30;
    ctx2d.beginPath(); ctx2d.arc(0.5, -7, eyeSize, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(0.5,  7, eyeSize, 0, TAU); ctx2d.fill();

    // نقاط بيضاء
    ctx2d.shadowBlur = 0;
    ctx2d.fillStyle = '#fff';
    ctx2d.beginPath(); ctx2d.arc(1.5, -7.5, 1, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(1.5,  6.5, 1, 0, TAU); ctx2d.fill();

    ctx2d.restore();
  }

  function drawTarget(now) {
    const r = 12 + Math.sin(now * 0.006) * 3;
    ctx2d.save();
    ctx2d.shadowColor = 'rgba(255,0,0,0.9)';
    ctx2d.shadowBlur = 20;
    ctx2d.strokeStyle = 'rgba(255,40,40,0.8)';
    ctx2d.lineWidth = 1.6;
    ctx2d.beginPath();
    ctx2d.arc(mouse.x, mouse.y, r, 0, TAU);
    ctx2d.stroke();
    ctx2d.strokeStyle = 'rgba(160,0,0,0.5)';
    ctx2d.beginPath();
    ctx2d.arc(mouse.x, mouse.y, r + 8, 0, TAU);
    ctx2d.stroke();
    ctx2d.fillStyle = 'rgba(255,50,50,1)';
    ctx2d.beginPath();
    ctx2d.arc(mouse.x, mouse.y, 2.6, 0, TAU);
    ctx2d.fill();
    ctx2d.restore();
  }

  function drawOverlay() {
    const g = ctx2d.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.25,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.78
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.65, `rgba(${20 + proximity * 60},0,0,${0.55 + proximity * 0.2})`);
    g.addColorStop(1, `rgba(${40 + proximity * 80},0,0,0.95)`);
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0, 0, W, H);

    if (redFlash > 0.001) {
      ctx2d.fillStyle = `rgba(140,0,0,${redFlash * 0.6})`;
      ctx2d.fillRect(0, 0, W, H);
    }
  }

  function render(now) {
    ctx2d.save();
    if (shake > 0.05) {
      const sx = (Math.random() - 0.5) * shake;
      const sy = (Math.random() - 0.5) * shake;
      ctx2d.translate(sx, sy);
    }

    ctx2d.fillStyle = '#000';
    ctx2d.fillRect(-30, -30, W + 60, H + 60);

    drawFog();
    drawTarget(now);

    ctx2d.save();
    ctx2d.shadowBlur = 0;
    drawDust();
    ctx2d.restore();

    // الوحش
    ctx2d.save();
    ctx2d.strokeStyle = BONE;
    ctx2d.fillStyle = BONE;
    ctx2d.lineCap = 'round';
    ctx2d.lineJoin = 'round';
    ctx2d.shadowColor = `rgba(200,20,20,${0.7 + proximity * 0.3})`;
    ctx2d.shadowBlur = 14;

    drawTail();
    drawRibs();
    drawSpine();
    drawLegs();
    drawSkull(spine[0].x, spine[0].y, headAngle);

    ctx2d.restore();

    // شرارات
    drawEmbers();

    // دم
    drawBlood();

    ctx2d.restore();

    drawOverlay();
  }

  /* ============================================================
     الحلقة الرئيسية
     ============================================================ */
  let last = performance.now();
  let started = false;

  function loop(now) {
    const dt = Math.min(now - last, 50);
    last = now;
    const k = dt / 16.667;

    if (started) update(k);
    render(now);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ============================================================
     البدء
     ============================================================ */
  const overlay = document.getElementById('overlay');
  const enterBtn = document.getElementById('enter');

  enterBtn.addEventListener('click', () => {
    try {
      if (!audio) {
        audio = buildHorrorAudio();
        scheduleHorror();
      }
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
    } catch (e) {
      console.warn('Audio failed:', e);
    }

    overlay.classList.add('hide');
    started = true;
    redFlash = 0.8;
    shake = 10;

    setTimeout(() => {
      const iv = setInterval(() => {
        if (Math.random() < 0.4) spawnBlood(Math.random() * W, -10);
      }, 900);
      timers.push(iv);
    }, 1200);
  });

  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.ctx.suspend();
    else audio.ctx.resume();
  });

})();
</script>
</body>
