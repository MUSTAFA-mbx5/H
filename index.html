<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة المصطفى | الأفعى العظمية</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;cursor:none;
    font-family:"Amiri","Times New Roman",serif;}
  canvas{display:block;position:fixed;inset:0}

  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1a0000 0%,#050000 55%,#000 100%);
    z-index:50;text-align:center;padding:24px;
    transition:opacity .9s ease,visibility .9s ease;}
  #overlay.hide{opacity:0;visibility:hidden}
  #overlay h1{color:#8b0000;font-size:clamp(28px,6vw,62px);letter-spacing:6px;
    text-shadow:0 0 18px #ff0000,0 0 40px #550000;margin-bottom:18px;
    animation:flick 3.2s infinite;}
  @keyframes flick{
    0%,18%,22%,25%,53%,57%,100%{opacity:1;text-shadow:0 0 18px #ff0000,0 0 40px #550000}
    20%,24%,55%{opacity:.4;text-shadow:none}}
  #overlay p{color:#5c5c5c;font-size:clamp(13px,2.2vw,17px);
    letter-spacing:3px;max-width:640px;line-height:2;margin-bottom:12px;}
  #overlay .warn{color:#7a1a1a;font-size:13px;letter-spacing:2px;margin-bottom:34px}
  #enter{cursor:pointer;background:transparent;color:#c9c4b4;
    border:1px solid #6b1414;padding:14px 46px;font-size:18px;
    letter-spacing:6px;font-family:inherit;border-radius:2px;
    text-shadow:0 0 8px #a00;transition:.35s ease;
    animation:pulse 2.6s infinite;}
  #enter:hover{background:#1a0000;color:#ff3b3b;border-color:#c00000;
    box-shadow:0 0 30px rgba(255,0,0,.55);}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 rgba(255,0,0,0)}
    50%{box-shadow:0 0 22px rgba(180,0,0,.5)}}
  #overlay .copy{position:absolute;bottom:22px;left:0;right:0;
    color:#4a3b3b;font-size:12px;letter-spacing:3px;}
  #watermark{position:fixed;bottom:12px;left:0;right:0;text-align:center;
    color:#2a1010;font-size:12px;letter-spacing:5px;
    pointer-events:none;user-select:none;z-index:40;
    text-shadow:0 0 8px #000;opacity:.85;}
  #watermark b{color:#4a1414;font-weight:normal}
  #hint{position:fixed;top:22px;left:0;right:0;text-align:center;
    color:#3a1414;font-size:12px;letter-spacing:6px;
    pointer-events:none;user-select:none;z-index:40;
    transition:opacity 2s ease;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">حرّك الماوس… إنها تشمّك</div>
<div id="watermark">© جميع الحقوق محفوظة — <b>مكتبة المصطفى</b></div>

<div id="overlay">
  <h1>الأفــعــى الــعــظــمــيــة</h1>
  <p>زحفت من أعماق الأرض… فقرة فقرة، ضلعاً ضلعاً. لا أرجل لها، لكنها لا تتوقف حتى تجدك.</p>
  <div class="warn">⚠ ارفع الصوت للأقصى — تجربة صوتية مرعبة ⚠</div>
  <button id="enter">ادخــل إن جــرؤت</button>
  <div class="copy">© مكتبة المصطفى — جميع الحقوق محفوظة</div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     1) محرك الصوت المرعب
     ============================================================ */
  let audio = null;

  function buildHorrorAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.knee.value = 4;
    comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.25;

    const master = ctx.createGain();
    master.gain.value = 0.0001;
    master.connect(comp).connect(ctx.destination);
    master.gain.exponentialRampToValueAtTime(0.95, ctx.currentTime + 3.5);

    // درون عميق
    const d1 = ctx.createOscillator(); d1.type = 'sine'; d1.frequency.value = 24;
    const d1g = ctx.createGain(); d1g.gain.value = 0.85;
    d1.connect(d1g).connect(master); d1.start();

    const d2 = ctx.createOscillator(); d2.type = 'sine'; d2.frequency.value = 24.7;
    const d2g = ctx.createGain(); d2g.gain.value = 0.65;
    d2.connect(d2g).connect(master); d2.start();

    const mid = ctx.createOscillator(); mid.type = 'sawtooth'; mid.frequency.value = 55;
    const midF = ctx.createBiquadFilter(); midF.type = 'lowpass';
    midF.frequency.value = 120; midF.Q.value = 14;
    const midG = ctx.createGain(); midG.gain.value = 0.09;
    mid.connect(midF).connect(midG).connect(master); mid.start();

    const lfo1 = ctx.createOscillator(); lfo1.frequency.value = 0.055;
    const lfo1g = ctx.createGain(); lfo1g.gain.value = 130;
    lfo1.connect(lfo1g).connect(midF.frequency); lfo1.start();

    // ضجيج
    const bufLen = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const bd = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) bd[i] = Math.random() * 2 - 1;

    const wind = ctx.createBufferSource(); wind.buffer = buf; wind.loop = true;
    const windF = ctx.createBiquadFilter(); windF.type = 'bandpass';
    windF.frequency.value = 260; windF.Q.value = 0.55;
    const windG = ctx.createGain(); windG.gain.value = 0.14;
    wind.connect(windF).connect(windG).connect(master); wind.start();

    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.035;
    const lfo2g = ctx.createGain(); lfo2g.gain.value = 0.12;
    lfo2.connect(lfo2g).connect(windG.gain); lfo2.start();

    // صرير
    const scrape = ctx.createBufferSource(); scrape.buffer = buf; scrape.loop = true;
    const scrapeF = ctx.createBiquadFilter(); scrapeF.type = 'highpass';
    scrapeF.frequency.value = 3200; scrapeF.Q.value = 3;
    const scrapeG = ctx.createGain(); scrapeG.gain.value = 0.018;
    scrape.connect(scrapeF).connect(scrapeG).connect(master); scrape.start();

    function heartbeat() {
      const t = ctx.currentTime;
      [0, 0.17].forEach((off, i) => {
        const o = ctx.createOscillator(); o.type = 'sine';
        const v = i === 0 ? 62 : 46;
        o.frequency.setValueAtTime(v, t + off);
        o.frequency.exponentialRampToValueAtTime(22, t + off + 0.22);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.linearRampToValueAtTime(i === 0 ? 1.2 : 0.9, t + off + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.36);
        o.connect(g).connect(master);
        o.start(t + off); o.stop(t + off + 0.4);
      });
    }

    function boneClick() {
      const t = ctx.currentTime;
      const clicks = 4 + Math.floor(Math.random() * 6);
      for (let i = 0; i < clicks; i++) {
        const off = i * (0.03 + Math.random() * 0.04);
        const o = ctx.createOscillator(); o.type = 'square';
        o.frequency.value = 1400 + Math.random() * 2600;
        const f = ctx.createBiquadFilter(); f.type = 'bandpass';
        f.frequency.value = 2000 + Math.random() * 1600; f.Q.value = 6;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.linearRampToValueAtTime(0.1 + Math.random() * 0.07, t + off + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.05);
        o.connect(f).connect(g).connect(master);
        o.start(t + off); o.stop(t + off + 0.06);
      }
    }

    function hiss() {
      const t = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.setValueAtTime(4500, t);
      f.frequency.exponentialRampToValueAtTime(2200, t + 1.6);
      f.Q.value = 5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.24, t + 0.12);
      g.gain.linearRampToValueAtTime(0.18, t + 1.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      const lfo = ctx.createOscillator(); lfo.frequency.value = 8;
      const lfoG = ctx.createGain(); lfoG.gain.value = 400;
      lfo.connect(lfoG).connect(f.frequency);
      lfo.start(t); lfo.stop(t + 1.9);
      src.connect(f).connect(g).connect(master);
      src.start(t); src.stop(t + 2.0);
    }

    function stab() {
      const t = ctx.currentTime;
      const scale = [174.61, 185, 196, 207.65, 220, 233.08, 246.94];
      const base = scale[Math.floor(Math.random() * scale.length)];
      [1, 1.07, 1.5].forEach((m, idx) => {
        const o = ctx.createOscillator();
        o.type = idx === 2 ? 'square' : 'sawtooth';
        o.frequency.value = base * m;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass';
        f.frequency.setValueAtTime(3200, t);
        f.frequency.exponentialRampToValueAtTime(220, t + 1.8);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.13 / (idx + 1), t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
        o.connect(f).connect(g).connect(master);
        o.start(t); o.stop(t + 2.1);
      });
    }

    function wail() {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sine';
      const start = 620 + Math.random() * 380;
      o.frequency.setValueAtTime(start, t);
      o.frequency.exponentialRampToValueAtTime(start * 0.3, t + 3.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.1, t + 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
      const rev = ctx.createBiquadFilter(); rev.type = 'bandpass';
      rev.frequency.value = 720; rev.Q.value = 1.6;
      o.connect(rev).connect(g).connect(master);
      o.start(t); o.stop(t + 3.6);
    }

    function snakeGrowl() {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(42, t);
      o.frequency.linearRampToValueAtTime(28, t + 1.6);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.value = 160; f.Q.value = 10;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.19, t + 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      o.connect(f).connect(g).connect(master);
      o.start(t); o.stop(t + 1.9);
    }

    return { ctx, master, heartbeat, boneClick, hiss, stab, wail, snakeGrowl };
  }

  let timers = [];
  function scheduleHorror() {
    const loopHB = () => { if (!audio) return; audio.heartbeat();
      timers.push(setTimeout(loopHB, 780 + Math.random()*260)); };
    loopHB();

    const loopBones = () => { if (!audio) return; audio.boneClick();
      timers.push(setTimeout(loopBones, 1400 + Math.random()*2200)); };
    setTimeout(loopBones, 900);

    const loopHiss = () => { if (!audio) return; audio.hiss();
      timers.push(setTimeout(loopHiss, 3200 + Math.random()*4500)); };
    setTimeout(loopHiss, 1800);

    const loopStab = () => { if (!audio) return; audio.stab();
      timers.push(setTimeout(loopStab, 2600 + Math.random()*5200)); };
    setTimeout(loopStab, 2000);

    const loopWail = () => { if (!audio) return; audio.wail();
      timers.push(setTimeout(loopWail, 6500 + Math.random()*9000)); };
    setTimeout(loopWail, 4200);

    const loopGrowl = () => { if (!audio) return; audio.snakeGrowl();
      timers.push(setTimeout(loopGrowl, 2400 + Math.random()*3200)); };
    setTimeout(loopGrowl, 1200);
  }

  /* ============================================================
     2) إعداد الكانفس
     ============================================================ */
  const canvas = document.getElementById('c');
  const ctx2d = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx2d.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ============================================================
     3) الماوس
     ============================================================ */
  const mouse = { x: W * 0.5, y: H * 0.5 };
  const hintEl = document.getElementById('hint');

  function setMouse(x, y) {
    mouse.x = x; mouse.y = y;
    if (hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
  }
  window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchstart', e => {
    const t = e.touches[0]; if (t) setMouse(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (t) setMouse(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /* ============================================================
     4) الأفعى العظمية — منطق السلسلة المصحّح
     ============================================================ */
  const TAU = Math.PI * 2;
  const NUM = 60;                 // عدد الفقرات
  const HEAD_SPEED = 14;          // سرعة الرأس
  const BONE = '#e8e3d2';
  const BONE_DARK = '#4a4330';

  // كل عقدة لها: موقع + حجم + زاوية
  const nodes = [];
  for (let i = 0; i < NUM; i++) {
    // تصغير تدريجي من الرأس نحو الذيل
    let size;
    const t = i / NUM;
    if (i < 3)       size = 9.0;                     // الرأس/الرقبة
    else if (i < 10) size = 9.0 - (i - 3) * 0.35;    // عنق
    else if (i < NUM - 10) size = 7.5 - t * 2.5;     // الجسم
    else             size = Math.max(2.2, 4.5 - (i - (NUM - 10)) * 0.22);

    nodes.push({
      x: -600 - i * 12,
      y: H * 0.5,
      size: size,
      ang: 0,
    });
  }

  let phase = 0;            // دورة التموج
  let headAngle = 0;        // اتجاه الرأس
  let shake = 0;
  let redFlash = 0;
  let proximity = 0;
  let tonguePhase = 0;
  let tongueOut = 0;

  /* ---- دالة التتبع الرئيسية (المصححة) ---- */
  function moveSnake(targetX, targetY) {
    const head = nodes[0];

    // (أ) حرّك الرأس نحو الهدف بخطوة مقدارها HEAD_SPEED
    const dx = targetX - head.x;
    const dy = targetY - head.y;
    const dist = Math.hypot(dx, dy);

    if (dist > HEAD_SPEED) {
      head.x += (dx / dist) * HEAD_SPEED;
      head.y += (dy / dist) * HEAD_SPEED;
    } else {
      head.x = targetX;
      head.y = targetY;
    }

    // (ب) كل فقرة تتبع التي قبلها — من الرأس إلى الذيل
    for (let i = 1; i < nodes.length; i++) {
      const prev = nodes[i - 1];
      const cur  = nodes[i];

      const ddx = cur.x - prev.x;
      const ddy = cur.y - prev.y;
      const d = Math.hypot(ddx, ddy) || 0.0001;

      // المسافة المطلوبة بين الفقرتين
      const wanted = (prev.size + cur.size) * 0.5;

      // لا تسمح للفقرة أن "تتجاوز" — قيّد المسافة
      const w = Math.min(d, wanted);

      cur.x = prev.x + (ddx / d) * w;
      cur.y = prev.y + (ddy / d) * w;

      // تحديث زاوية كل فقرة (للتوجيه في الرسم)
      cur.ang = Math.atan2(ddy, ddx);
    }

    // تحديث اتجاه الرأس
    if (dist > 0.001) {
      const target = Math.atan2(dy, dx);
      let da = target - headAngle;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      headAngle += da * 0.18;
    }
  }

  /* ============================================================
     5) جزيئات
     ============================================================ */
  const dust = [], fog = [], blood = [], embers = [];

  for (let i = 0; i < 32; i++) {
    fog.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 110 + Math.random() * 250,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.18,
      a: 0.024 + Math.random() * 0.042
    });
  }

  function spawnDust() {
    const tail = nodes[nodes.length - 1];
    if (Math.random() < 0.5) {
      dust.push({
        x: tail.x + (Math.random() - 0.5) * 45,
        y: tail.y + (Math.random() - 0.5) * 45,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -0.15 - Math.random() * 0.5,
        life: 1, r: 0.6 + Math.random() * 2.2
      });
    }
    if (dust.length > 380) dust.splice(0, dust.length - 380);
  }

  function spawnEmbers() {
    const head = nodes[0];
    if (Math.random() < 0.6) {
      const a = headAngle + (Math.random() - 0.5) * 1.4;
      const r = 42;
      embers.push({
        x: head.x + Math.cos(a) * r, y: head.y + Math.sin(a) * r,
        vx: (Math.random() - 0.5) * 1.2, vy: -0.4 - Math.random() * 0.9,
        life: 1, r: 0.8 + Math.random() * 2.3
      });
    }
    if (embers.length > 280) embers.splice(0, embers.length - 280);
  }

  function spawnBlood(x, y) {
    blood.push({
      x, y, vy: 0.6 + Math.random() * 1.8,
      r: 1 + Math.random() * 3.5, life: 1
    });
    if (blood.length > 140) blood.splice(0, blood.length - 140);
  }

  function updateParticles(k) {
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * k; p.y += p.vy * k; p.life -= 0.008 * k;
      if (p.life <= 0) dust.splice(i, 1);
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const p = embers[i];
      p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.02 * k;
      p.life -= 0.012 * k;
      if (p.life <= 0) embers.splice(i, 1);
    }
    for (const f of fog) {
      f.x += f.vx * k; f.y += f.vy * k;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r;
      if (f.y > H + f.r) f.y = -f.r;
    }
    for (let i = blood.length - 1; i >= 0; i--) {
      const b = blood[i];
      b.y += b.vy * k;
      if (b.y > H + 30) blood.splice(i, 1);
    }
  }

  /* ============================================================
     6) تحديث الحالة
     ============================================================ */
  function update(k) {
    // (1) حرّك الرأس نحو الماوس، والباقي يتبعه
    moveSnake(mouse.x, mouse.y);

    // (2) تموج جانبي إضافي (زحف الأفعى الحقيقي)
    phase += 0.075 * k;
    const waveAmp = 2.6;
    for (let i = 3; i < nodes.length; i++) {
      const a = nodes[i - 1], b = nodes[i];
      const ang = b.ang;
      const nx = -Math.sin(ang), ny = Math.cos(ang);
      const t = i / nodes.length;
      const ampFactor = Math.sin(t * Math.PI) * 0.85 + 0.15;
      const wave = Math.sin(phase - i * 0.32) * waveAmp * ampFactor;
      b.x += nx * wave * 0.18;
      b.y += ny * wave * 0.18;
    }

    // (3) لسان
    tonguePhase += 0.09 * k;
    tongueOut = Math.max(0, Math.sin(tonguePhase) * 1.3);

    // (4) مدى القرب
    const head = nodes[0];
    const dToMouse = Math.hypot(mouse.x - head.x, mouse.y - head.y);
    proximity = Math.max(0, Math.min(1, 1 - dToMouse / 300));

    if (dToMouse < 220) {
      shake = Math.max(shake, Math.min(16, (220 - dToMouse) * 0.13));
      if (Math.random() < 0.35) spawnBlood(mouse.x, -10);
      if (Math.random() < 0.03) redFlash = Math.max(redFlash, 0.6);
    }
    shake *= Math.pow(0.90, k);
    redFlash *= Math.pow(0.94, k);

    updateParticles(k);
    spawnDust();
    spawnEmbers();
  }

  /* ============================================================
     7) الرسم
     ============================================================ */
  function drawFog() {
    ctx2d.save();
    ctx2d.globalCompositeOperation = 'lighter';
    for (const f of fog) {
      const g = ctx2d.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, `rgba(80,15,15,${f.a})`);
      g.addColorStop(0.5, `rgba(35,8,8,${f.a * 0.5})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx2d.fillStyle = g;
      ctx2d.beginPath(); ctx2d.arc(f.x, f.y, f.r, 0, TAU); ctx2d.fill();
    }
    ctx2d.restore();
  }

  function drawDust() {
    ctx2d.fillStyle = 'rgba(150,180,220,1)';
    for (const p of dust) {
      ctx2d.globalAlpha = p.life * 0.42;
      ctx2d.beginPath(); ctx2d.arc(p.x, p.y, p.r, 0, TAU); ctx2d.fill();
    }
    ctx2d.globalAlpha = 1;
  }

  function drawEmbers() {
    ctx2d.save();
    ctx2d.shadowColor = 'rgba(255,60,0,0.9)'; ctx2d.shadowBlur = 14;
    for (const p of embers) {
      ctx2d.globalAlpha = p.life * 0.9;
      const g = ctx2d.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, 'rgba(255,210,120,1)');
      g.addColorStop(0.4, 'rgba(255,60,0,0.85)');
      g.addColorStop(1, 'rgba(120,0,0,0)');
      ctx2d.fillStyle = g;
      ctx2d.beginPath(); ctx2d.arc(p.x, p.y, p.r * 3, 0, TAU); ctx2d.fill();
    }
    ctx2d.restore();
  }

  function drawBlood() {
    ctx2d.save();
    ctx2d.fillStyle = 'rgba(120,0,0,1)';
    ctx2d.shadowColor = 'rgba(255,0,0,0.7)'; ctx2d.shadowBlur = 8;
    for (const b of blood) {
      ctx2d.globalAlpha = 0.85;
      ctx2d.beginPath(); ctx2d.arc(b.x, b.y, b.r, 0, TAU); ctx2d.fill();
      ctx2d.beginPath();
      ctx2d.ellipse(b.x, b.y - b.r * 1.6, b.r * 0.55, b.r * 1.6, 0, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.restore();
  }

  /* ---- رسم العمود الفقري والأضلاع من الذيل إلى الرأس ---- */
  function drawSnakeSkeleton() {
    // ارسم من الذيل للرأس
    for (let i = nodes.length - 1; i >= 1; i--) {
      const p = nodes[i];
      const a = p.ang;
      const sc = p.size / 9;   // معامل التصغير

      // رابط الخط بين الفقرة والسابقة
      const prev = nodes[i - 1];
      ctx2d.strokeStyle = BONE;
      ctx2d.lineWidth = Math.max(1.2, 2.4 * sc);
      ctx2d.beginPath();
      ctx2d.moveTo(prev.x, prev.y);
      ctx2d.lineTo(p.x, p.y);
      ctx2d.stroke();

      ctx2d.save();
      ctx2d.translate(p.x, p.y);
      ctx2d.rotate(a);

      // ===== جسم الفقرة =====
      ctx2d.fillStyle = BONE;
      ctx2d.beginPath();
      ctx2d.ellipse(0, 0, 2.6 * sc + 0.5, 2.1 * sc + 0.4, 0, 0, TAU);
      ctx2d.fill();

      // ===== النتوء الشوكي العلوي (شكل Y) =====
      ctx2d.lineWidth = 1.5 * sc;
      ctx2d.strokeStyle = BONE;
      ctx2d.beginPath();
      ctx2d.moveTo(0, 0);
      ctx2d.lineTo(-0.4 * sc, -5 * sc);
      ctx2d.stroke();
      ctx2d.beginPath();
      ctx2d.moveTo(-0.4 * sc, -5 * sc);
      ctx2d.lineTo(-2.2 * sc, -7.5 * sc);
      ctx2d.moveTo(-0.4 * sc, -5 * sc);
      ctx2d.lineTo(1.4 * sc, -7.5 * sc);
      ctx2d.stroke();

      // ===== الأضلاع =====
      if (i >= 4 && i < nodes.length - 6) {
        const t = i / nodes.length;
        const ribFactor = Math.sin(Math.min(1, Math.max(0, (i - 6) / (nodes.length * 0.7))) * Math.PI);
        const ribLen = (16 + 10 * ribFactor) * sc + 2;

        for (const s of [-1, 1]) {
          const cx = 1.8 * sc;
          const cy = s * ribLen * 0.55;
          const ex = 0.4 * sc;
          const ey = s * ribLen;

          ctx2d.lineWidth = 1.5 * sc;
          ctx2d.strokeStyle = BONE;
          ctx2d.beginPath();
          ctx2d.moveTo(0, 0);
          ctx2d.quadraticCurveTo(cx, cy, ex, ey);
          ctx2d.stroke();

          ctx2d.fillStyle = BONE;
          ctx2d.beginPath();
          ctx2d.arc(ex, ey, 1.3 * sc + 0.3, 0, TAU);
          ctx2d.fill();
        }
      }

      // نتوءات جانبية صغيرة
      if (i >= 2 && i < nodes.length - 4) {
        ctx2d.lineWidth = 1.2 * sc;
        ctx2d.beginPath();
        ctx2d.moveTo(0, 0); ctx2d.lineTo(-1.3 * sc,  2.2 * sc);
        ctx2d.moveTo(0, 0); ctx2d.lineTo(-1.3 * sc, -2.2 * sc);
        ctx2d.stroke();
      }

      ctx2d.restore();
    }
  }

  /* ---- جمجمة الأفعى ---- */
  function drawSnakeSkull(x, y, a) {
    ctx2d.save();
    ctx2d.translate(x, y);
    ctx2d.rotate(a);

    // هالة
    const halo = ctx2d.createRadialGradient(0, 0, 4, 0, 0, 95);
    halo.addColorStop(0, `rgba(220,0,0,${0.4 + proximity * 0.4})`);
    halo.addColorStop(0.4, `rgba(150,0,0,${0.18 + proximity * 0.18})`);
    halo.addColorStop(1, 'rgba(80,0,0,0)');
    ctx2d.fillStyle = halo;
    ctx2d.beginPath(); ctx2d.arc(0, 0, 95, 0, TAU); ctx2d.fill();

    ctx2d.fillStyle = BONE;
    ctx2d.shadowColor = `rgba(255,20,20,${0.75 + proximity * 0.25})`;
    ctx2d.shadowBlur = 22;

    // القحف الخلفي
    ctx2d.beginPath();
    ctx2d.ellipse(-10, 0, 15, 14, 0, 0, TAU);
    ctx2d.fill();

    // نتوءات خلفية
    for (let i = 0; i < 5; i++) {
      const ang = Math.PI * 0.7 + (i / 4) * Math.PI * 1.6;
      const bx = -10 + Math.cos(ang) * 14;
      const by = Math.sin(ang) * 13;
      const nx = Math.cos(ang), ny = Math.sin(ang);
      ctx2d.beginPath();
      ctx2d.moveTo(bx - ny * 2.2, by + nx * 2.2);
      ctx2d.lineTo(bx + nx * 6, by + ny * 6);
      ctx2d.lineTo(bx + ny * 2.2, by - nx * 2.2);
      ctx2d.closePath();
      ctx2d.fill();
    }

    // الفك العلوي المثلث الطويل
    ctx2d.beginPath();
    ctx2d.moveTo(-4, -12);
    ctx2d.lineTo(4, -10);
    ctx2d.lineTo(42, -3);
    ctx2d.lineTo(44, 0);
    ctx2d.lineTo(42, 3);
    ctx2d.lineTo(4, 10);
    ctx2d.lineTo(-4, 12);
    ctx2d.closePath();
    ctx2d.fill();

    // شقوق
    ctx2d.shadowBlur = 0;
    ctx2d.strokeStyle = BONE_DARK;
    ctx2d.lineWidth = 1.3;
    ctx2d.beginPath();
    ctx2d.moveTo(-18, -6); ctx2d.lineTo(-10, -2); ctx2d.lineTo(-15, 5);
    ctx2d.moveTo(-6, -11); ctx2d.lineTo(-2, -5);
    ctx2d.moveTo(4, 8); ctx2d.lineTo(10, 3);
    ctx2d.moveTo(20, -4); ctx2d.lineTo(28, -2);
    ctx2d.stroke();

    // محجرا العين
    ctx2d.fillStyle = '#000';
    ctx2d.beginPath(); ctx2d.ellipse(-8, -6, 5.5, 5.5, 0, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.ellipse(-8,  6, 5.5, 5.5, 0, 0, TAU); ctx2d.fill();

    // فتحتا الأنف
    ctx2d.beginPath(); ctx2d.arc(34, -2.2, 1.7, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(34,  2.2, 1.7, 0, TAU); ctx2d.fill();

    // العيون الحمراء
    const pulse = 0.7 + 0.3 * Math.sin(performance.now() * 0.011);
    const eyeSize = 3.4 + proximity * 1.8;
    ctx2d.fillStyle = `rgba(255,15,15,${pulse})`;
    ctx2d.shadowColor = 'rgba(255,0,0,1)';
    ctx2d.shadowBlur = 34;
    ctx2d.beginPath(); ctx2d.arc(-7, -6, eyeSize, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(-7,  6, eyeSize, 0, TAU); ctx2d.fill();

    ctx2d.shadowBlur = 0;
    ctx2d.fillStyle = '#fff';
    ctx2d.beginPath(); ctx2d.arc(-6, -6.6, 1, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(-6,  5.4, 1, 0, TAU); ctx2d.fill();

    // الأنياب
    ctx2d.fillStyle = BONE;
    ctx2d.shadowColor = 'rgba(255,80,80,0.6)';
    ctx2d.shadowBlur = 6;
    ctx2d.beginPath();
    ctx2d.moveTo(30, -3.5); ctx2d.lineTo(32, -0.5); ctx2d.lineTo(27, -2);
    ctx2d.closePath(); ctx2d.fill();
    ctx2d.beginPath();
    ctx2d.moveTo(30, 3.5); ctx2d.lineTo(32, 0.5); ctx2d.lineTo(27, 2);
    ctx2d.closePath(); ctx2d.fill();

    // أسنان الفك
    for (let i = 0; i < 8; i++) {
      const bx = 6 + i * 3.2;
      const tl = 2.6 - Math.abs(i - 4) * 0.15;
      if (tl <= 0) continue;
      ctx2d.beginPath();
      ctx2d.moveTo(bx - 1.1, -1.5); ctx2d.lineTo(bx, 0.5 + tl); ctx2d.lineTo(bx + 1.1, -1.5);
      ctx2d.closePath(); ctx2d.fill();
      ctx2d.beginPath();
      ctx2d.moveTo(bx - 1.1, 1.5); ctx2d.lineTo(bx, -0.5 - tl); ctx2d.lineTo(bx + 1.1, 1.5);
      ctx2d.closePath(); ctx2d.fill();
    }

    // اللسان المشعب
    ctx2d.shadowColor = 'rgba(255,0,60,0.9)';
    ctx2d.shadowBlur = 15;
    ctx2d.strokeStyle = `rgba(220,20,60,${0.8 + tongueOut * 0.2})`;
    ctx2d.lineWidth = 1.7;
    const baseX = 42;
    const tLen = 14 + tongueOut * 26;
    ctx2d.beginPath();
    ctx2d.moveTo(baseX, 0);
    ctx2d.lineTo(baseX + tLen * 0.55, 0);
    ctx2d.stroke();
    ctx2d.beginPath();
    ctx2d.moveTo(baseX + tLen * 0.55, 0);
    ctx2d.lineTo(baseX + tLen, -4 - tongueOut * 3);
    ctx2d.moveTo(baseX + tLen * 0.55, 0);
    ctx2d.lineTo(baseX + tLen,  4 + tongueOut * 3);
    ctx2d.stroke();

    ctx2d.fillStyle = 'rgba(255,40,80,1)';
    ctx2d.beginPath();
    ctx2d.arc(baseX + tLen, -4 - tongueOut * 3, 1.6, 0, TAU); ctx2d.fill();
    ctx2d.beginPath();
    ctx2d.arc(baseX + tLen,  4 + tongueOut * 3, 1.6, 0, TAU); ctx2d.fill();

    ctx2d.restore();
  }

  function drawTarget(now) {
    const r = 12 + Math.sin(now * 0.006) * 3;
    ctx2d.save();
    ctx2d.shadowColor = 'rgba(255,0,0,0.9)'; ctx2d.shadowBlur = 20;
    ctx2d.strokeStyle = 'rgba(255,40,40,0.8)'; ctx2d.lineWidth = 1.6;
    ctx2d.beginPath(); ctx2d.arc(mouse.x, mouse.y, r, 0, TAU); ctx2d.stroke();
    ctx2d.strokeStyle = 'rgba(160,0,0,0.5)';
    ctx2d.beginPath(); ctx2d.arc(mouse.x, mouse.y, r + 8, 0, TAU); ctx2d.stroke();
    ctx2d.fillStyle = 'rgba(255,50,50,1)';
    ctx2d.beginPath(); ctx2d.arc(mouse.x, mouse.y, 2.6, 0, TAU); ctx2d.fill();
    ctx2d.restore();
  }

  function drawOverlay() {
    const g = ctx2d.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.25,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.78
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.65, `rgba(${20 + proximity * 70},0,0,${0.55 + proximity * 0.2})`);
    g.addColorStop(1, `rgba(${40 + proximity * 90},0,0,0.95)`);
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0, 0, W, H);

    if (redFlash > 0.001) {
      ctx2d.fillStyle = `rgba(140,0,0,${redFlash * 0.6})`;
      ctx2d.fillRect(0, 0, W, H);
    }
  }

  function render(now) {
    ctx2d.save();
    if (shake > 0.05) {
      ctx2d.translate(
        (Math.random() - 0.5) * shake,
        (Math.random() - 0.5) * shake
      );
    }

    ctx2d.fillStyle = '#000';
    ctx2d.fillRect(-30, -30, W + 60, H + 60);

    drawFog();
    drawTarget(now);

    ctx2d.save(); ctx2d.shadowBlur = 0; drawDust(); ctx2d.restore();

    // الأفعى
    ctx2d.save();
    ctx2d.fillStyle = BONE;
    ctx2d.strokeStyle = BONE;
    ctx2d.lineCap = 'round';
    ctx2d.lineJoin = 'round';
    ctx2d.shadowColor = `rgba(220,20,20,${0.7 + proximity * 0.3})`;
    ctx2d.shadowBlur = 12;

    drawSnakeSkeleton();
    drawSnakeSkull(nodes[0].x, nodes[0].y, headAngle);

    ctx2d.restore();

    drawEmbers();
    drawBlood();
    ctx2d.restore();
    drawOverlay();
  }

  /* ============================================================
     8) الحلقة الرئيسية
     ============================================================ */
  let last = performance.now();
  let started = false;

  function loop(now) {
    const dt = Math.min(now - last, 50);
    last = now;
    const k = dt / 16.667;
    if (started) update(k);
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ============================================================
     9) البدء
     ============================================================ */
  const overlay = document.getElementById('overlay');
  const enterBtn = document.getElementById('enter');

  enterBtn.addEventListener('click', () => {
    try {
      if (!audio) { audio = buildHorrorAudio(); scheduleHorror(); }
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
    } catch (e) { console.warn('Audio failed:', e); }

    overlay.classList.add('hide');
    started = true;
    redFlash = 0.85;
    shake = 12;

    setTimeout(() => {
      const iv = setInterval(() => {
        if (Math.random() < 0.4) spawnBlood(Math.random() * W, -10);
      }, 850);
      timers.push(iv);
    }, 1000);
  });

  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.ctx.suspend();
    else audio.ctx.resume();
  });

})();
</script>
</body>
