<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة المصطفى | الهيكل العظمي</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    cursor:none;
    font-family:"Amiri","Times New Roman",serif;
  }
  canvas{display:block;position:fixed;inset:0}

  /* ===== شاشة البداية (ضرورية لتشغيل الصوت) ===== */
  #overlay{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1a0000 0%,#050000 55%,#000 100%);
    z-index:50;text-align:center;padding:24px;
    transition:opacity .9s ease,visibility .9s ease;
  }
  #overlay.hide{opacity:0;visibility:hidden}
  #overlay h1{
    color:#8b0000;
    font-size:clamp(28px,6vw,58px);
    letter-spacing:6px;
    text-shadow:0 0 18px #ff0000,0 0 40px #550000;
    margin-bottom:18px;
    animation:flick 3.2s infinite;
  }
  @keyframes flick{
    0%,18%,22%,25%,53%,57%,100%{opacity:1;text-shadow:0 0 18px #ff0000,0 0 40px #550000}
    20%,24%,55%{opacity:.4;text-shadow:none}
  }
  #overlay p{
    color:#5c5c5c;font-size:clamp(13px,2.2vw,17px);
    letter-spacing:3px;max-width:640px;line-height:2;margin-bottom:12px;
  }
  #overlay .warn{color:#7a1a1a;font-size:13px;letter-spacing:2px;margin-bottom:34px}
  #enter{
    cursor:pointer;background:transparent;
    color:#c9c4b4;border:1px solid #6b1414;
    padding:14px 46px;font-size:18px;letter-spacing:6px;
    font-family:inherit;border-radius:2px;
    text-shadow:0 0 8px #a00;
    box-shadow:0 0 0 rgba(255,0,0,0);
    transition:.35s ease;
    animation:pulse 2.6s infinite;
  }
  #enter:hover{
    background:#1a0000;color:#ff3b3b;border-color:#c00000;
    box-shadow:0 0 30px rgba(255,0,0,.55);
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 rgba(255,0,0,0)}
    50%{box-shadow:0 0 22px rgba(180,0,0,.5)}
  }
  #overlay .copy{
    position:absolute;bottom:22px;left:0;right:0;
    color:#4a3b3b;font-size:12px;letter-spacing:3px;
  }

  /* ===== علامة الحقوق الدائمة ===== */
  #watermark{
    position:fixed;bottom:12px;left:0;right:0;
    text-align:center;color:#2a1010;font-size:12px;
    letter-spacing:5px;pointer-events:none;user-select:none;
    z-index:40;text-shadow:0 0 8px #000;
    opacity:.75;
  }
  #watermark b{color:#4a1414;font-weight:normal}

  /* ===== تلميح ===== */
  #hint{
    position:fixed;top:22px;left:0;right:0;text-align:center;
    color:#3a1414;font-size:12px;letter-spacing:6px;
    pointer-events:none;user-select:none;z-index:40;
    transition:opacity 2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">حــرّك الــمــاوس… إنــه قــادم</div>

<div id="watermark">© جميع الحقوق محفوظة — <b>مكتبة المصطفى</b></div>

<div id="overlay">
  <h1>الهــيــكــل الــعــظــمــي</h1>
  <p>شيءٌ ما يسكن في العتمة… يسمع أنفاسك، يقتفي أثرك، ولا يتوقف حتى يمسك بك.</p>
  <div class="warn">⚠ يُنصح برفع مستوى الصوت — تجربة مرعبة ⚠</div>
  <button id="enter">ادخــل إن جــرؤت</button>
  <div class="copy">© مكتبة المصطفى — جميع الحقوق محفوظة</div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     محرك الصوت المرعب (Web Audio API)
     ============================================================ */
  let audio = null;

  function buildHorrorAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    /* --- الماستر --- */
    const master = ctx.createGain();
    master.gain.value = 0.0001;
    master.connect(ctx.destination);
    // دخول تدريجي
    master.gain.exponentialRampToValueAtTime(0.42, ctx.currentTime + 4);

    /* --- درون عميق 1 (36Hz) --- */
    const d1 = ctx.createOscillator();
    d1.type = 'sine';
    d1.frequency.value = 36;
    const d1g = ctx.createGain();
    d1g.gain.value = 0.55;
    d1.connect(d1g).connect(master);
    d1.start();

    /* --- درون عميق 2 (منخفض قليلاً للاهتزاز) --- */
    const d2 = ctx.createOscillator();
    d2.type = 'sine';
    d2.frequency.value = 36.8;
    const d2g = ctx.createGain();
    d2g.gain.value = 0.4;
    d2.connect(d2g).connect(master);
    d2.start();

    /* --- درون أوسط + فلتر متحرك --- */
    const mid = ctx.createOscillator();
    mid.type = 'sawtooth';
    mid.frequency.value = 82.4;
    const midF = ctx.createBiquadFilter();
    midF.type = 'lowpass';
    midF.frequency.value = 180;
    midF.Q.value = 9;
    const midG = ctx.createGain();
    midG.gain.value = 0.045;
    mid.connect(midF).connect(midG).connect(master);
    mid.start();

    // LFO بطيء على فلتر الدرون
    const lfo1 = ctx.createOscillator();
    lfo1.frequency.value = 0.07;
    const lfo1g = ctx.createGain();
    lfo1g.gain.value = 160;
    lfo1.connect(lfo1g).connect(midF.frequency);
    lfo1.start();

    /* --- ضجيج رياح --- */
    const bufLen = ctx.sampleRate * 3;
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const bd = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) bd[i] = Math.random() * 2 - 1;

    const wind = ctx.createBufferSource();
    wind.buffer = buf;
    wind.loop = true;
    const windF = ctx.createBiquadFilter();
    windF.type = 'bandpass';
    windF.frequency.value = 380;
    windF.Q.value = 0.7;
    const windG = ctx.createGain();
    windG.gain.value = 0.055;
    wind.connect(windF).connect(windG).connect(master);
    wind.start();

    // LFO لتيارات الرياح
    const lfo2 = ctx.createOscillator();
    lfo2.frequency.value = 0.045;
    const lfo2g = ctx.createGain();
    lfo2g.gain.value = 0.05;
    lfo2.connect(lfo2g).connect(windG.gain);
    lfo2.start();

    /* --- دالة نبضة القلب --- */
    function heartbeat() {
      const t = ctx.currentTime;
      [0, 0.16].forEach((off, i) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        const v = i === 0 ? 62 : 48;
        o.frequency.setValueAtTime(v, t + off);
        o.frequency.exponentialRampToValueAtTime(26, t + off + 0.18);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.linearRampToValueAtTime(i === 0 ? 0.75 : 0.55, t + off + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.32);
        o.connect(g).connect(master);
        o.start(t + off);
        o.stop(t + off + 0.36);
      });
    }

    /* --- دالة طعنة/صرير مفاجئ --- */
    function stab() {
      const t = ctx.currentTime;
      const scale = [207.65, 220, 233.08, 246.94, 261.63, 277.18, 311.13, 329.63];
      const base = scale[Math.floor(Math.random() * scale.length)];
      [1, 1.055].forEach((m) => {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = base * m;
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(2400, t);
        f.frequency.exponentialRampToValueAtTime(320, t + 1.4);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.075, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o.connect(f).connect(g).connect(master);
        o.start(t);
        o.stop(t + 1.7);
      });
    }

    /* --- همسة/صرخة بعيدة --- */
    function wail() {
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = 'sine';
      const start = 480 + Math.random() * 320;
      o.frequency.setValueAtTime(start, t);
      o.frequency.exponentialRampToValueAtTime(start * 0.42, t + 2.4);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.055, t + 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      const rev = ctx.createBiquadFilter();
      rev.type = 'bandpass';
      rev.frequency.value = 900;
      rev.Q.value = 1.4;
      o.connect(rev).connect(g).connect(master);
      o.start(t);
      o.stop(t + 2.8);
    }

    return { ctx, master, heartbeat, stab, wail };
  }

  /* جدولة الأصوات العشوائية */
  let timers = [];
  function scheduleHorror() {
    const loop = () => {
      if (!audio) return;
      audio.heartbeat();
      const t1 = setTimeout(loop, 950 + Math.random() * 350);
      timers.push(t1);
    };
    loop();

    const loopStab = () => {
      if (!audio) return;
      audio.stab();
      const t = setTimeout(loopStab, 3500 + Math.random() * 6500);
      timers.push(t);
    };
    setTimeout(loopStab, 2500);

    const loopWail = () => {
      if (!audio) return;
      audio.wail();
      const t = setTimeout(loopWail, 8000 + Math.random() * 11000);
      timers.push(t);
    };
    setTimeout(loopWail, 5000);
  }

  /* ============================================================
     إعداد الكانفس
     ============================================================ */
  const canvas = document.getElementById('c');
  const ctx2d = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx2d.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ============================================================
     الماوس
     ============================================================ */
  const mouse = { x: W * 0.5, y: H * 0.5 };
  const hintEl = document.getElementById('hint');

  function setMouse(x, y) {
    mouse.x = x; mouse.y = y;
    if (hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
  }
  window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchstart', e => {
    const t = e.touches[0]; if (t) setMouse(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (t) setMouse(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /* ============================================================
     الهيكل العظمي
     ============================================================ */
  const TAU = Math.PI * 2;
  const NUM = 22, SEG = 12.5, BODY_END = 13;
  const BONE = '#ded9c6';
  const BONE_DARK = '#6a6350';

  const spine = [];
  for (let i = 0; i < NUM; i++) {
    spine.push({ x: -220 - i * SEG, y: H * 0.5 });
  }

  let phase = 0;
  let headAngle = 0;
  let shake = 0;              // اهتزاز الشاشة
  let redFlash = 0;           // وميض أحمر
  let spawnShakeT = 0;

  function dot(x, y, r) {
    ctx2d.beginPath();
    ctx2d.arc(x, y, r, 0, TAU);
    ctx2d.fill();
  }
  function bone(x1, y1, x2, y2, w) {
    ctx2d.lineWidth = w;
    ctx2d.beginPath();
    ctx2d.moveTo(x1, y1);
    ctx2d.lineTo(x2, y2);
    ctx2d.stroke();
    dot(x1, y1, w * 0.72);
    dot(x2, y2, w * 0.72);
  }
  function segAngle(i) {
    const a = spine[Math.max(0, i - 1)];
    const b = spine[Math.min(NUM - 1, i + 1)];
    return Math.atan2(b.y - a.y, b.x - a.x);
  }
  function ik(hip, foot, l1, l2, bend) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, l1 + l2 - 0.01);
    d = Math.max(d, Math.abs(l1 - l2) + 0.01);
    const a = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const ang = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ka = a + ang * bend;
    return { x: hip.x + Math.cos(ka) * l1, y: hip.y + Math.sin(ka) * l1 };
  }

  /* ============================================================
     جزيئات: غبار + ضباب + قطرات دم
     ============================================================ */
  const dust = [];
  const fog  = [];
  const blood = [];

  // ضباب ثابت في الخلفية
  for (let i = 0; i < 26; i++) {
    fog.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 90 + Math.random() * 200,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.18,
      a: 0.02 + Math.random() * 0.035
    });
  }

  function spawnDust() {
    const tail = spine[NUM - 1];
    if (Math.random() < 0.42) {
      dust.push({
        x: tail.x + (Math.random() - 0.5) * 30,
        y: tail.y + (Math.random() - 0.5) * 30,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -0.15 - Math.random() * 0.4,
        life: 1,
        r: 0.5 + Math.random() * 1.7
      });
    }
    if (dust.length > 340) dust.splice(0, dust.length - 340);
  }

  function spawnBlood(x, y) {
    // قطرات دم تنزل من أعلى الشاشة بشكل عشوائي
    blood.push({
      x: x, y: y,
      vy: 0.6 + Math.random() * 1.6,
      r: 1 + Math.random() * 3.2,
      life: 1
    });
    if (blood.length > 120) blood.splice(0, blood.length - 120);
  }

  function updateParticles(k) {
    // غبار
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * k; p.y += p.vy * k;
      p.life -= 0.008 * k;
      if (p.life <= 0) dust.splice(i, 1);
    }
    // ضباب
    for (const f of fog) {
      f.x += f.vx * k; f.y += f.vy * k;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r;
      if (f.y > H + f.r) f.y = -f.r;
    }
    // دم
    for (let i = blood.length - 1; i >= 0; i--) {
      const b = blood[i];
      b.y += b.vy * k;
      if (b.y > H + 30) blood.splice(i, 1);
    }
  }

  /* ============================================================
     تحديث الهيكل
     ============================================================ */
  function update(k) {
    const head = spine[0];

    let dx = mouse.x - head.x;
    let dy = mouse.y - head.y;
    let dist = Math.hypot(dx, dy) || 0.001;

    const speed = Math.min(dist * 0.15, 16) * k;
    head.x += (dx / dist) * speed;
    head.y += (dy / dist) * speed;

    // اتجاه الرأس
    const target = Math.atan2(dy, dx);
    let da = target - headAngle;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    headAngle += da * Math.min(1, 0.16 * k);

    // السلسلة
    for (let i = 1; i < NUM; i++) {
      const a = spine[i - 1], b = spine[i];
      const ddx = b.x - a.x, ddy = b.y - a.y;
      const d = Math.hypot(ddx, ddy) || 1;
      const diff = (d - SEG) / d;
      b.x -= ddx * diff;
      b.y -= ddy * diff;
    }

    phase += (speed * 0.021 + 0.016) * k;

    // اهتزاز الشاشة عند الاقتراب
    if (dist < 130 && spawnShakeT <= 0) {
      shake = Math.min(9, (130 - dist) * 0.09);
      if (Math.random() < 0.25) spawnBlood(mouse.x, -10);
      if (Math.random() < 0.02) redFlash = 0.45;
    }
    shake *= Math.pow(0.90, k);
    redFlash *= Math.pow(0.94, k);

    updateParticles(k);
    spawnDust();
  }

  /* ============================================================
     الرسم
     ============================================================ */

  function drawFog() {
    ctx2d.save();
    ctx2d.globalCompositeOperation = 'lighter';
    for (const f of fog) {
      const g = ctx2d.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, `rgba(60,20,20,${f.a})`);
      g.addColorStop(0.5, `rgba(30,8,8,${f.a * 0.5})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx2d.fillStyle = g;
      ctx2d.beginPath();
      ctx2d.arc(f.x, f.y, f.r, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.restore();
  }

  function drawDust() {
    ctx2d.fillStyle = 'rgba(150,180,220,1)';
    for (const p of dust) {
      ctx2d.globalAlpha = p.life * 0.4;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.r, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.globalAlpha = 1;
  }

  function drawBlood() {
    ctx2d.save();
    ctx2d.fillStyle = 'rgba(120,0,0,1)';
    ctx2d.shadowColor = 'rgba(255,0,0,0.7)';
    ctx2d.shadowBlur = 8;
    for (const b of blood) {
      ctx2d.globalAlpha = 0.85;
      // شكل قطرة
      ctx2d.beginPath();
      ctx2d.arc(b.x, b.y, b.r, 0, TAU);
      ctx2d.fill();
      ctx2d.beginPath();
      ctx2d.ellipse(b.x, b.y - b.r * 1.6, b.r * 0.55, b.r * 1.6, 0, 0, TAU);
      ctx2d.fill();
    }
    ctx2d.restore();
  }

  function drawTail() {
    for (let i = BODY_END + 1; i < NUM - 1; i++) {
      const t = (i - BODY_END) / (NUM - 1 - BODY_END);
      const w = Math.max(1, 3.4 - t * 2.4);
      bone(spine[i].x, spine[i].y, spine[i + 1].x, spine[i + 1].y, w);
    }
  }

  function drawRibs() {
    ctx2d.lineWidth = 2.2;
    for (let i = 3; i <= 11; i++) {
      const p = spine[i];
      const a = segAngle(i);
      const fx = Math.cos(a), fy = Math.sin(a);
      const nx = -fy, ny = fx;
      const t = (i - 3) / 8;
      const len = 8 + 15 * Math.sin(t * Math.PI);
      for (const s of [1, -1]) {
        const ox = nx * s, oy = ny * s;
        const cx = p.x + fx * len * 0.10 + ox * len * 1.05;
        const cy = p.y + fy * len * 0.10 + oy * len * 1.05;
        const ex = p.x + fx * len * 0.55 + ox * len * 0.28;
        const ey = p.y + fy * len * 0.55 + oy * len * 0.28;
        ctx2d.beginPath();
        ctx2d.moveTo(p.x, p.y);
        ctx2d.quadraticCurveTo(cx, cy, ex, ey);
        ctx2d.stroke();
      }
    }
  }

  function drawSpine() {
    ctx2d.lineWidth = 3.4;
    ctx2d.beginPath();
    ctx2d.moveTo(spine[0].x, spine[0].y);
    for (let i = 1; i <= BODY_END; i++) ctx2d.lineTo(spine[i].x, spine[i].y);
    ctx2d.stroke();
    for (let i = 1; i <= BODY_END; i++) dot(spine[i].x, spine[i].y, 2.2);
  }

  const LEGS = [
    { i: 4,  side:  1, off: 0 },
    { i: 4,  side: -1, off: Math.PI },
    { i: 11, side:  1, off: Math.PI },
    { i: 11, side: -1, off: 0 }
  ];

  function drawLegs() {
    for (const L of LEGS) {
      const p = spine[L.i];
      const a = segAngle(L.i);
      const fx = Math.cos(a), fy = Math.sin(a);
      const nx = -fy * L.side, ny = fx * L.side;
      const hip = { x: p.x + nx * 7, y: p.y + ny * 7 };
      const s = Math.sin(phase + L.off);
      const reach = 26 + Math.max(0, s) * 7;
      const foot = {
        x: hip.x + nx * reach + fx * (s * 13),
        y: hip.y + ny * reach + fy * (s * 13)
      };
      const knee = ik(hip, foot, 17, 17, L.side);
      bone(hip.x, hip.y, knee.x, knee.y, 2.8);
      bone(knee.x, knee.y, foot.x, foot.y, 2.3);
      dot(foot.x, foot.y, 2.6);
    }
  }

  /* جمجمة أكثر رعباً: عيون متوهجة، أسنان حادة، شقوق */
  function drawSkull(x, y, a) {
    ctx2d.save();
    ctx2d.translate(x, y);
    ctx2d.rotate(a);

    // هالة حمراء خلف الجمجمة
    const halo = ctx2d.createRadialGradient(0, 0, 4, 0, 0, 42);
    halo.addColorStop(0, 'rgba(180,0,0,0.30)');
    halo.addColorStop(1, 'rgba(120,0,0,0)');
    ctx2d.fillStyle = halo;
    ctx2d.beginPath();
    ctx2d.arc(0, 0, 42, 0, TAU);
    ctx2d.fill();

    ctx2d.fillStyle = BONE;
    ctx2d.shadowColor = 'rgba(180,10,10,0.85)';
    ctx2d.shadowBlur = 16;

    // القحف
    ctx2d.beginPath();
    ctx2d.ellipse(-2, 0, 14, 12, 0, 0, TAU);
    ctx2d.fill();

    // الوجه / الأنف
    ctx2d.beginPath();
    ctx2d.ellipse(13, 0, 12, 8.5, 0, 0, TAU);
    ctx2d.fill();

    // شقوق على القحف
    ctx2d.shadowBlur = 0;
    ctx2d.strokeStyle = BONE_DARK;
    ctx2d.lineWidth = 0.9;
    ctx2d.beginPath();
    ctx2d.moveTo(-12, -6); ctx2d.lineTo(-6, -2); ctx2d.lineTo(-9, 3);
    ctx2d.moveTo(-4, -11); ctx2d.lineTo(-1, -6);
    ctx2d.moveTo(2, 8); ctx2d.lineTo(5, 4);
    ctx2d.stroke();

    // أسنان حادة (مثلثة)
    ctx2d.fillStyle = BONE;
    for (let i = -3; i <= 3; i++) {
      const th = i * 0.36;
      const bx = 13 + Math.cos(th) * 12;
      const by = 0 + Math.sin(th) * 8.5;
      const nx = Math.cos(th), ny = Math.sin(th);
      const px = -ny, py = nx;
      const L = i === 0 ? 5.6 : 4.4 - Math.abs(i) * 0.35;
      ctx2d.beginPath();
      ctx2d.moveTo(bx + px * 1.7, by + py * 1.7);
      ctx2d.lineTo(bx + nx * L, by + ny * L);
      ctx2d.lineTo(bx - px * 1.7, by - py * 1.7);
      ctx2d.closePath();
      ctx2d.fill();
    }

    // محجرا العين (ثقوب سوداء عميقة)
    ctx2d.fillStyle = '#000';
    ctx2d.beginPath(); ctx2d.arc(-1, -5.3, 4.9, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(-1,  5.3, 4.9, 0, TAU); ctx2d.fill();
    // فتحتا الأنف
    ctx2d.beginPath(); ctx2d.arc(18.5, -2.3, 1.4, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(18.5,  2.3, 1.4, 0, TAU); ctx2d.fill();

    // العيون الحمراء المتوهجة (نبض)
    const pulse = 0.75 + 0.25 * Math.sin(performance.now() * 0.008);
    ctx2d.fillStyle = `rgba(255,20,20,${pulse})`;
    ctx2d.shadowColor = 'rgba(255,0,0,1)';
    ctx2d.shadowBlur = 20;
    ctx2d.beginPath(); ctx2d.arc(0.2, -5.1, 2.3, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(0.2,  5.1, 2.3, 0, TAU); ctx2d.fill();

    // نقاط بيضاء صغيرة داخل العيون
    ctx2d.shadowBlur = 0;
    ctx2d.fillStyle = '#fff';
    ctx2d.beginPath(); ctx2d.arc(0.9, -5.5, 0.7, 0, TAU); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(0.9,  4.7, 0.7, 0, TAU); ctx2d.fill();

    ctx2d.restore();
  }

  /* هدف الماوس: دائرة دم مشوهة */
  function drawTarget(now) {
    const r = 11 + Math.sin(now * 0.006) * 3;
    ctx2d.save();
    ctx2d.shadowColor = 'rgba(255,0,0,0.9)';
    ctx2d.shadowBlur = 18;
    ctx2d.strokeStyle = 'rgba(255,40,40,0.75)';
    ctx2d.lineWidth = 1.6;
    ctx2d.beginPath();
    ctx2d.arc(mouse.x, mouse.y, r, 0, TAU);
    ctx2d.stroke();

    // حلقة خارجية
    ctx2d.strokeStyle = 'rgba(160,0,0,0.45)';
    ctx2d.beginPath();
    ctx2d.arc(mouse.x, mouse.y, r + 7, 0, TAU);
    ctx2d.stroke();

    ctx2d.fillStyle = 'rgba(255,50,50,1)';
    ctx2d.beginPath();
    ctx2d.arc(mouse.x, mouse.y, 2.4, 0, TAU);
    ctx2d.fill();
    ctx2d.restore();
  }

  /* Vignette + فلاش أحمر */
  function drawOverlay() {
    // تظليل الأطراف
    const g = ctx2d.createRadialGradient(
      W * 0.5, H * 0.5, Math.min(W, H) * 0.28,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.78
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(20,0,0,0.92)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0, 0, W, H);

    // فلاش أحمر
    if (redFlash > 0.001) {
      ctx2d.fillStyle = `rgba(120,0,0,${redFlash * 0.5})`;
      ctx2d.fillRect(0, 0, W, H);
    }
  }

  /* ============================================================
     الرسم الكامل
     ============================================================ */
  function render(now) {
    // اهتزاز الشاشة
    ctx2d.save();
    if (shake > 0.05) {
      const sx = (Math.random() - 0.5) * shake;
      const sy = (Math.random() - 0.5) * shake;
      ctx2d.translate(sx, sy);
    }

    // خلفية
    ctx2d.fillStyle = '#000';
    ctx2d.fillRect(-20, -20, W + 40, H + 40);

    // ضباب في الخلفية
    drawFog();

    // هدف الماوس
    drawTarget(now);

    // غبار
    ctx2d.save();
    ctx2d.shadowBlur = 0;
    drawDust();
    ctx2d.restore();

    // الهيكل
    ctx2d.save();
    ctx2d.strokeStyle = BONE;
    ctx2d.fillStyle = BONE;
    ctx2d.lineCap = 'round';
    ctx2d.lineJoin = 'round';
    ctx2d.shadowColor = 'rgba(180,20,20,0.75)';
    ctx2d.shadowBlur = 12;

    drawTail();
    drawRibs();
    drawSpine();
    drawLegs();
    drawSkull(spine[0].x, spine[0].y, headAngle);

    ctx2d.restore();

    // دم ينزل من أعلى
    drawBlood();

    ctx2d.restore(); // إلغاء الاهتزاز

    // تظليل + فلاش
    drawOverlay();
  }

  /* ============================================================
     الحلقة الرئيسية
     ============================================================ */
  let last = performance.now();
  let started = false;

  function loop(now) {
    const dt = Math.min(now - last, 50);
    last = now;
    const k = dt / 16.667;

    if (started) update(k);
    render(now);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ============================================================
     بدء التجربة (بعد نقر المستخدم لتشغيل الصوت)
     ============================================================ */
  const overlay = document.getElementById('overlay');
  const enterBtn = document.getElementById('enter');

  enterBtn.addEventListener('click', () => {
    // 1) شغّل الصوت
    try {
      if (!audio) {
        audio = buildHorrorAudio();
        scheduleHorror();
      }
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
    } catch (e) {
      console.warn('Audio failed:', e);
    }

    // 2) أخفِ الشاشة وابدأ
    overlay.classList.add('hide');
    started = true;
    redFlash = 0.7;
    shake = 6;

    // 3) ابدأ الدم بالتساقط
    setTimeout(() => {
      const iv = setInterval(() => {
        if (Math.random() < 0.4) spawnBlood(Math.random() * W, -10);
      }, 900);
      timers.push(iv);
    }, 1200);
  });

  /* إيقاف مؤقت عند إخفاء الصفحة */
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.ctx.suspend();
    else audio.ctx.resume();
  });

})();
</script>
</body>
